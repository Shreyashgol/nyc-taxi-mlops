# Promote (S3): move a challenger model to champion with human approval.
# The production environment requires a reviewer to approve before the job runs.
name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model version to promote (leave empty for current challenger)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, lab-app]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve and validate candidate
        id: candidate
        run: |
          python3 - "${{ inputs.version }}" <<'PYEOF'
          import json, os, sys
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError

          tracking = os.environ["MLFLOW_TRACKING_URI"].rstrip("/")
          input_version = sys.argv[1] if len(sys.argv) > 1 else ""

          def api(path):
              return json.loads(urlopen(Request(f"{tracking}/api/2.0/mlflow/{path}")).read())

          if input_version:
              version = input_version
          else:
              resp = api(f"registered-models/alias?name=trip-duration&alias=challenger")
              version = str(resp["model_version"]["version"])

          mv = api(f"model-versions/get?name=trip-duration&version={version}")["model_version"]
          tags = {t["key"]: t["value"] for t in mv.get("tags", [])}

          if "mae_min" not in tags:
              print(f"::error::Version {version} has no evaluation tags")
              sys.exit(1)

          print(f"✓ Version {version} evaluated (MAE={tags.get('mae_min')})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"tags={json.dumps(tags)}\n")
          PYEOF

      - name: Record outgoing champion
        id: outgoing
        run: |
          python3 - <<'PYEOF'
          import json, os
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError

          tracking = os.environ["MLFLOW_TRACKING_URI"].rstrip("/")
          try:
              resp = json.loads(urlopen(Request(
                  f"{tracking}/api/2.0/mlflow/registered-models/alias?name=trip-duration&alias=champion"
              )).read())
              old = str(resp["model_version"]["version"])
          except (HTTPError, KeyError):
              old = "none"

          print(f"Outgoing champion: {old}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"previous={old}\n")
          PYEOF

      - name: Set champion alias
        run: |
          version="${{ steps.candidate.outputs.version }}"
          echo "Setting champion alias to version $version"
          python3 - "$version" <<'PYEOF'
          import json, os, sys
          from urllib.request import urlopen, Request

          tracking = os.environ["MLFLOW_TRACKING_URI"].rstrip("/")
          version = sys.argv[1]
          req = Request(
              f"{tracking}/api/2.0/mlflow/registered-models/alias",
              data=json.dumps({"name": "trip-duration", "alias": "champion", "version": version}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          urlopen(req)
          print(f"✓ champion alias -> version {version}")
          PYEOF

      - name: Reload serving-champion container
        run: deploy/web.sh reload champion

      - name: Verify predict returns champion
        run: |
          sleep 5
          response=$(curl -fsS --retry 10 --retry-delay 3 \
            -H 'Content-Type: application/json' \
            http://localhost:80/predict \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}')
          echo "Response: $response"

          alias=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['model']['alias'])")
          version=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['model']['version'])")
          echo "Model: alias=$alias version=$version"

          expected="${{ steps.candidate.outputs.version }}"
          if [[ "$alias" != "champion" ]]; then
            echo "::error::/predict returned alias=$alias, expected champion"
            exit 1
          fi
          if [[ "$version" != "$expected" ]]; then
            echo "::error::/predict returned version=$version, expected $expected"
            exit 1
          fi
          echo "✓ /predict returns champion v$version"

      - name: Summary
        run: |
          {
            echo "## Promotion Summary"
            echo "- **Model:** trip-duration"
            echo "- **Promoted version:** ${{ steps.candidate.outputs.version }}"
            echo "- **Previous champion:** ${{ steps.outgoing.outputs.previous }}"
            echo "- **Method:** POST /reload (zero downtime)"
          } >> "$GITHUB_STEP_SUMMARY"
