# CD (S3): blue-green deploy of the app onto the app host via self-hosted runner.
# Deploys to the idle colour, smoke-tests it, then switches traffic. The old colour keeps running.
# Rollback: workflow_dispatch with rollback=true switches back without deploying.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to the other colour (no deploy, just switch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Rollback: just switch to the other colour, no deploy ---
      - name: Rollback (switch to other colour)
        if: inputs.rollback == true
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == "none" ]]; then
            echo "::error::No colour is live yet, nothing to roll back to"
            exit 1
          fi
          other=$([[ "$live" == blue ]] && echo green || echo blue)
          other_tag=$(deploy/web.sh tag "$other")
          if [[ "$other_tag" == "none" ]]; then
            echo "::error::$other has no image, nothing to roll back to"
            exit 1
          fi
          echo "Rolling back: $live -> $other (tag: $other_tag)"
          deploy/web.sh smoke "$other"
          deploy/web.sh switch "$other"
          deploy/web.sh status

      # --- Normal deploy: idle colour, smoke, switch ---
      - name: Prepare Traefik and network
        if: inputs.rollback != true
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare

      - name: Determine target colour and image tag
        if: inputs.rollback != true
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then
            colour=green
          else
            colour=blue
          fi
          tag="sha-${TARGET_SHA::7}"
          {
            echo "colour=$colour"
            echo "tag=$tag"
            echo "sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $tag to $colour (live is $live)"

      - name: Deploy to idle colour
        if: inputs.rollback != true
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          export IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          colour="${{ steps.target.outputs.colour }}"
          tag="${{ steps.target.outputs.tag }}"

          # Set the colour's tag; leave the other as-is
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then
            BLUE_TAG=$(deploy/web.sh tag blue)
            export BLUE_TAG
            export GREEN_TAG="$tag"
          elif [[ "$live" == green ]]; then
            export BLUE_TAG="$tag"
            GREEN_TAG=$(deploy/web.sh tag green)
            export GREEN_TAG
          else
            # First deploy: both colours get the same tag
            export BLUE_TAG="$tag"
            export GREEN_TAG="$tag"
          fi

          docker compose -f deploy/compose.web.yaml pull "app-$colour"
          docker compose -f deploy/compose.web.yaml up -d --no-deps "app-$colour"

      - name: Smoke test idle colour
        if: inputs.rollback != true
        run: |
          colour="${{ steps.target.outputs.colour }}"
          sha="${{ steps.target.outputs.sha }}"
          deploy/web.sh smoke "$colour" "$sha"

      - name: Switch traffic
        if: inputs.rollback != true
        run: |
          colour="${{ steps.target.outputs.colour }}"
          deploy/web.sh switch "$colour"

      - name: Status
        if: always()
        run: deploy/web.sh status || true
